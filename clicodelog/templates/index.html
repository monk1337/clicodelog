<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>clicodelog</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b57d0'/%3E%3Cpath d='m9 11 5 5-5 5M17 21h6' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
    <link rel="stylesheet" href="{{ asset('app.css') }}">
</head>
<body class="hide-tool-boxes">
{% include '_icons.html' %}
    <header class="appbar">
        <button class="icon-btn nav-toggle" onclick="toggleNav()" title="Projects" aria-label="Show projects"><svg class="i"><use href="#i-folder"/></svg></button>
        <a class="brand" href="/" title="clicodelog">
            <span class="brand-mark"><svg class="i"><use href="#i-logo"/></svg></span>
            <span class="brand-name">clicodelog</span>
        </a>
        <label class="source-switch" title="Which tool's history to browse">
            <span class="sr-only">Source</span>
            <select id="source-select" class="select" onchange="changeSource(this.value)">
                <option value="claude-code">Claude Code</option>
            </select>
        </label>
        <button class="search-trigger" id="search-btn" onclick="toggleSearch()" title="Search every conversation (⌘K)">
            <svg class="i"><use href="#i-search"/></svg>
            <span class="search-trigger-text">Search conversations</span>
            <kbd>⌘K</kbd>
        </button>
        <div class="appbar-actions">
            <span class="sync-status" id="sync-status" title="Last sync time"></span>
            <button class="icon-btn" id="sync-btn" onclick="manualSync()" title="Sync now" aria-label="Sync now"><svg class="i"><use href="#i-sync"/></svg></button>
            <button class="icon-btn" id="bookmarks-btn" onclick="openBookmarksPanel()" title="Bookmarks" aria-label="Bookmarks"><svg class="i"><use href="#i-star"/></svg></button>
            <button class="icon-btn" id="stats-btn" onclick="toggleStats()" title="Usage" aria-label="Usage"><svg class="i"><use href="#i-chart"/></svg></button>
            <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Switch theme" aria-label="Switch theme"><svg class="i" id="theme-icon"><use href="#i-moon"/></svg></button>
        </div>
    </header>
    <div id="source-warning" class="banner" role="status" hidden></div>

    <main class="app">
        <nav class="pane nav-pane" id="projects-panel" aria-label="Projects">
            <div class="pane-head">
                <h2>Projects</h2>
                <select id="project-sort" class="select select-sm" onchange="changeProjectSort(this.value)" title="Sort projects">
                    <option value="name">A–Z</option>
                    <option value="recent">Recent</option>
                    <option value="sessions">Most sessions</option>
                </select>
            </div>
            <label class="field field-search">
                <svg class="i"><use href="#i-search"/></svg>
                <input type="search" id="project-search" placeholder="Filter projects" autocomplete="off" spellcheck="false">
            </label>
            <div class="tag-filter-bar" id="tag-filter-bar" hidden></div>
            <div class="pane-body" id="projects-list">
                <div class="loading"><div class="spinner"></div>Loading projects…</div>
            </div>
        </nav>

        <div class="resize-handle" id="resize-handle-1" title="Drag to resize · double-click to reset"></div>

        <div class="workspace">
            <section class="pane sessions-pane" id="sessions-panel" aria-label="Sessions">
                <div class="pane-head">
                    <h2>Sessions <span class="count" id="sessions-count"></span></h2>
                </div>
                <div class="session-filters" id="session-filters" hidden>
                    <select id="filter-sort" class="select select-sm" onchange="applySessionFilters()" title="Sort">
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                        <option value="largest">Largest</option>
                        <option value="messages">Most messages</option>
                    </select>
                    <select id="filter-date" class="select select-sm" onchange="applySessionFilters()" title="When">
                        <option value="all">Any time</option>
                        <option value="today">Today</option>
                        <option value="week">This week</option>
                        <option value="month">This month</option>
                        <option value="older">Older</option>
                    </select>
                    <select id="filter-size" class="select select-sm" onchange="applySessionFilters()" title="Size">
                        <option value="all">Any size</option>
                        <option value="<10KB">&lt; 10 KB</option>
                        <option value="10-100KB">10–100 KB</option>
                        <option value="100KB-1MB">100 KB–1 MB</option>
                        <option value=">1MB">&gt; 1 MB</option>
                    </select>
                    <button class="btn btn-text sm" id="filter-reset" onclick="resetSessionFilters()" hidden>Reset</button>
                </div>
                <div class="pane-body" id="sessions-list">
                    <div class="empty-state"><p>Select a project to see its sessions</p></div>
                </div>
            </section>

            <div class="resize-handle inner" id="resize-handle-2" title="Drag to resize · double-click to reset"></div>

            <section class="pane conv-pane" id="conversation-panel" aria-label="Conversation">
{% include '_conversation.html' %}
            </section>
        </div>
    </main>

{% include '_dialogs.html' %}

    <script src="{{ asset('vendor.js') }}"></script>
    <script src="{{ asset('app.js') }}"></script>
</body>
</html>
