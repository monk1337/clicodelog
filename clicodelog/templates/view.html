<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Conversation · clicodelog</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b57d0'/%3E%3Cpath d='m9 11 5 5-5 5M17 21h6' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
    <link rel="stylesheet" href="{{ asset('app.css') }}">
</head>
<body class="hide-tool-boxes focus-page">
{% include '_icons.html' %}
    <header class="appbar">
        <a class="brand" href="/" title="Back to all conversations">
            <span class="brand-mark"><svg class="i"><use href="#i-logo"/></svg></span>
            <span class="brand-name">clicodelog</span>
        </a>
        <span class="focus-title" id="view-title"></span>
        <button class="search-trigger compact" id="search-btn" onclick="toggleSearch()" title="Search every conversation (⌘K)">
            <svg class="i"><use href="#i-search"/></svg>
            <span class="search-trigger-text">Search</span>
            <kbd>⌘K</kbd>
        </button>
        <div class="appbar-actions">
            <span class="sync-status" id="sync-status" title="Last sync time"></span>
            <button class="icon-btn" id="sync-btn" onclick="manualSync()" title="Sync now" aria-label="Sync now"><svg class="i"><use href="#i-sync"/></svg></button>
            <button class="icon-btn" id="bookmarks-btn" onclick="openBookmarksPanel()" title="Bookmarks" aria-label="Bookmarks"><svg class="i"><use href="#i-star"/></svg></button>
            <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Switch theme" aria-label="Switch theme"><svg class="i" id="theme-icon"><use href="#i-moon"/></svg></button>
            <button class="icon-btn" onclick="window.close()" title="Close tab" aria-label="Close tab"><svg class="i"><use href="#i-close"/></svg></button>
        </div>
    </header>

    <main class="focus-main conv-pane" id="conversation-panel">
{% include '_conversation.html' %}
    </main>

{% with focus=True %}{% include '_dialogs.html' %}{% endwith %}

    <script src="{{ asset('vendor.js') }}"></script>
    <script src="{{ asset('view.js') }}"></script>
</body>
</html>
